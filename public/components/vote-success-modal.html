<div class="modal" id="vote-success-modal" aria-hidden="true">
  <div class="modal__backdrop"></div>

  <div class="modal__dialog" role="dialog" aria-modal="true">
    <button class="modal__close" type="button" aria-label="Закрыть">&times;</button>

    <h2 class="modal__title">Голосование</h2>
    <p class="modal__text">
      Вы успешно авторизовались.<br>
      Подтвердите, что хотите проголосовать за выбранного кандидата.
    </p>

    <div class="modal__actions">
      <button type="button" class="modal__submit" id="vote-confirm-btn">
        Подтвердить голос
      </button>
    </div>
  </div>
</div>
