<div class="modal" id="modal-admin" aria-hidden="true">
    <div class="modal__backdrop" data-close-modal></div>
    <div class="modal__dialog">
        <div class="modal__content">
            <button class="modal__close" type="button" data-close-modal>×</button>
            <h2 class="modal__title">Вход для администратора</h2>

            <form id="admin-login-form" class="modal__form">
                <input type="text" class="modal__input" name="login" placeholder="Логин" autocomplete="username">
                <input type="password" class="modal__input" name="password" placeholder="Пароль"
                    autocomplete="current-password">

                <div class="modal__actions-admin">
                    <button type="submit" class="modal__submit">Войти</button>
                </div>

                <div class="modal__error" id="admin-login-error" style="display:none;color:#c00;margin-top:8px;"></div>
            </form>
        </div>
    </div>
</div>
