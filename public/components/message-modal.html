<div class="modal" id="message-modal" aria-hidden="true">
    <div class="modal__backdrop" data-close-modal></div>

    <div class="modal__dialog" role="dialog" aria-modal="true">
        <button class="modal__close" type="button" data-close-modal aria-label="Закрыть">×</button>

        <h2 class="modal__title" id="message-title" style="margin-bottom: 16px;">
            Сообщение
        </h2>

        <div class="modal__content" style="text-align: center; padding: 20px;">
            <p id="message-text" style="font-size: 16px; line-height: 1.5; margin-bottom: 20px;">
            </p>

            <div class="modal__actions" style="justify-content: center;">
                <button type="button" class="modal__submit" id="message-ok-btn" style="min-width: 120px;">
                    ОК
                </button>
            </div>
        </div>
    </div>
</div>
